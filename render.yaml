services:
  - type: web
    name: jobtrack-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromService:
          type: postgresql
          name: jobtrack-db
          property: connectionString
      - key: JWT_SECRET
        generate: true

  - type: static
    name: jobtrack-frontend
    buildCommand: echo "No build step needed"
    publishDirectory: frontend
    plan: free
    autoDeploy: true